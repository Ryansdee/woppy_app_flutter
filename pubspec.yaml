name: woppy_app
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  dotted_border: ^2.1.0

  image_picker: ^1.1.2
  file_picker: ^8.1.2
  emoji_picker_flutter: 4.4.0
  
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2

  # Navigation
  go_router: ^14.3.0

  # State management
  flutter_riverpod: ^2.5.1

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"  # ton icône 1024x1024px
  min_sdk_android: 21
  adaptive_icon_background: "#8A6BFE"  # couleur fond violet Woppy
  adaptive_icon_foreground: "assets/icon/logo.png"

flutter:
  uses-material-design: true


